<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#1d3930" />
    <title>Evening Note — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); background: #f4efe7; color: #18201d; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 420px); border: 1px solid #d5cdc1; border-radius: 28px; padding: 28px; background: #fffdf8; box-shadow: 0 22px 70px rgba(50, 57, 50, .1); }
      .mark { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 16px; background: #1d3930; color: #fff; font-size: 21px; }
      p:first-of-type { margin-top: 28px; color: #6b756f; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-family: Georgia, serif; font-size: 38px; line-height: 1.08; font-weight: 500; }
      .lede, .draft-help { color: #53615a; font-size: 15px; line-height: 1.65; }
      .draft-panel { margin-top: 22px; }
      .draft-panel[hidden] { display: none; }
      label { display: block; margin-bottom: 8px; color: #35443d; font-size: 14px; font-weight: 700; }
      textarea { width: 100%; min-height: 180px; resize: vertical; border: 1px solid #8b968f; border-radius: 16px; padding: 15px; background: #fff; color: #18201d; font: inherit; font-size: 16px; line-height: 1.55; }
      button { margin-top: 14px; min-height: 48px; width: 100%; border: 0; border-radius: 14px; background: #1d3930; color: white; font: inherit; font-weight: 700; }
      button.secondary { border: 1px solid #7d8a83; background: transparent; color: #1d3930; }
      button:focus-visible, textarea:focus-visible { outline: 3px solid #456657; outline-offset: 3px; }
      #draft-status { min-height: 24px; margin: 10px 0 0; color: #35443d; font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">✦</div>
      <p>Evening Note</p>
      <h1>You’re offline for a moment.</h1>
      <p class="lede">You can keep editing the most recent unsaved draft on this device. It will remain local until you reconnect and save it in the app.</p>
      <section id="draft-panel" class="draft-panel" hidden>
        <label id="draft-label" for="offline-draft">Device-local draft</label>
        <textarea id="offline-draft" maxlength="10000"></textarea>
        <button id="save-draft" type="button">Keep draft on this device</button>
        <p id="draft-status" role="status" aria-live="polite"></p>
      </section>
      <p id="no-draft" class="draft-help">No unsaved draft is available on this device.</p>
      <button class="secondary" id="retry" type="button">Try reconnecting</button>
    </main>
    <script>
      (() => {
        const prefix = 'evening-note:draft:';
        const panel = document.getElementById('draft-panel');
        const noDraft = document.getElementById('no-draft');
        const textarea = document.getElementById('offline-draft');
        const label = document.getElementById('draft-label');
        const status = document.getElementById('draft-status');
        let selected = null;

        try {
          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index);
            if (!key || !key.startsWith(prefix)) continue;
            try {
              const value = JSON.parse(localStorage.getItem(key));
              if (
                typeof value?.content === 'string' &&
                typeof value?.date === 'string' &&
                typeof value?.timezone === 'string' &&
                typeof value?.updatedAt === 'string' &&
                (!selected || value.updatedAt > selected.value.updatedAt)
              ) selected = { key, value };
            } catch { /* Ignore malformed device storage. */ }
          }
        } catch {
          noDraft.textContent = 'Device storage is unavailable. Reconnect before continuing.';
        }

        if (selected) {
          panel.hidden = false;
          noDraft.hidden = true;
          textarea.value = selected.value.content;
          label.textContent = `Unsaved draft for ${selected.value.date}`;
        }

        document.getElementById('save-draft').addEventListener('click', () => {
          if (!selected) return;
          try {
            const nextValue = { ...selected.value, content: textarea.value, updatedAt: new Date().toISOString() };
            localStorage.setItem(selected.key, JSON.stringify(nextValue));
            selected.value = nextValue;
            status.textContent = 'Draft kept on this device. Reconnect to save it privately.';
          } catch {
            status.textContent = 'This device could not store the draft. Copy the text before closing.';
          }
        });

        document.getElementById('retry').addEventListener('click', () => location.reload());
      })();
    </script>
  </body>
</html>
