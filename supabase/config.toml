project_id = "evening-note"

[auth]
enable_signup = true
site_url = "https://rusherzero.github.io/evening-note/"
additional_redirect_urls = [
  "http://localhost:3000/",
  "http://localhost:3000/?auth=recovery",
  "https://evening-note-1945.gs-samshuijzen.chatgpt.site",
  "https://evening-note-1945.gs-samshuijzen.chatgpt.site/?auth=recovery",
  "https://rusherzero.github.io/evening-note/",
  "https://rusherzero.github.io/evening-note/?auth=recovery"
]

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
# Require the current password for in-session password changes. Password
# recovery continues to use Supabase's emailed recovery link.
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.push-subscription]
verify_jwt = false

[functions.test-push]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
