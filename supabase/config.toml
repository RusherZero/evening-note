project_id = "evening-note"

[auth]
enable_signup = true
site_url = "https://rusherzero.github.io/evening-note/"
additional_redirect_urls = [
  "http://localhost:3000/",
  "http://localhost:3000/?auth=recovery",
  "https://evening-note-1945.gs-samshuijzen.chatgpt.site",
  "https://evening-note-1945.gs-samshuijzen.chatgpt.site/?auth=recovery",
  "https://rusherzero.github.io/evening-note/",
  "https://rusherzero.github.io/evening-note/?auth=recovery"
]

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
# Password changes require the current password in the hosted dashboard. Keep
# email-OTP reauthentication disabled so the password flow stays link-based.
secure_password_change = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.push-subscription]
verify_jwt = false

[functions.test-push]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
