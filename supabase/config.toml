project_id = "evening-note"

[auth]
site_url = "https://evening-note-1945.gs-samshuijzen.chatgpt.site"
additional_redirect_urls = [
  "http://localhost:3000",
  "https://evening-note-1945.gs-samshuijzen.chatgpt.site",
  "https://rusherzero.github.io/evening-note/"
]

[auth.email]
# Eight digits increases entropy while remaining easy to paste. The client
# accepts every Supabase-supported email OTP length (6–10 digits).
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.email.template.magic_link]
subject = "Your Evening Note sign-in code"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.push-subscription]
verify_jwt = false

[functions.test-push]
verify_jwt = false

[functions.send-reminders]
verify_jwt = false
