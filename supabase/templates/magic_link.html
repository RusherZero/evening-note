<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f4efe7;color:#18201d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <div style="background:#fffdf8;border:1px solid #d5cdc1;border-radius:24px;padding:32px">
        <p style="margin:0 0 20px;color:#1d3930;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase">Evening Note</p>
        <h1 style="margin:0 0 14px;font-family:Georgia,serif;font-size:32px;font-weight:500;line-height:1.15">Your sign-in code</h1>
        <p style="margin:0 0 24px;color:#52625a;font-size:16px;line-height:1.6">Enter this six-digit code in Evening Note:</p>
        <p style="margin:0;padding:18px;border-radius:16px;background:#1d3930;color:#fffdf8;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:.25em;text-align:center">{{ .Token }}</p>
        <p style="margin:24px 0 0;color:#5d6963;font-size:14px;line-height:1.6">If you did not request this code, you can ignore this email.</p>
      </div>
    </div>
  </body>
</html>
